; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-lcd
src_dir = firmware/src
include_dir = firmware/include
test_dir = tests/firmware

[env:esp32-s3]
platform = espressif32@6.12.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_type = release
build_unflags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-std=gnu++11
build_flags = 
	-std=gnu++2a
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Wl,--wrap=hidd_control_xfer_cb
	-Wl,--wrap=tud_hid_report_complete_cb
	${env.build_flags}

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++20
test_ignore = test_communication_library
build_src_filter =
	+<ffb_report_handler.cpp>
	+<ffb_force_calculator.cpp>
	+<ffb_device_input.cpp>

[env:native-axis1]
extends = env:native
build_flags = ${env:native.build_flags} -DNUM_AXIS=1
test_filter = test_firmware_boundaries, test_spec_compliance, test_serial_transport, test_can_transport

[env:native-axis3]
extends = env:native
build_flags = ${env:native.build_flags} -DNUM_AXIS=3
test_filter = test_firmware_boundaries, test_spec_compliance, test_serial_transport, test_can_transport

[env:esp32-s3-axis1]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -DNUM_AXIS=1

[env:esp32-s3-axis3]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -DNUM_AXIS=3

[env:esp32-s3-serial]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -DENABLE_MOTOR_OUTPUT=1 -DUSE_SERIAL_POSITION=1

[env:native-sanitized]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all

[env:native-sanitized-axis1]
extends = env:native-sanitized
build_flags = ${env:native-sanitized.build_flags} -DNUM_AXIS=1
test_filter = test_firmware_boundaries, test_spec_compliance, test_serial_transport, test_can_transport

[env:native-sanitized-axis3]
extends = env:native-sanitized
build_flags = ${env:native-sanitized.build_flags} -DNUM_AXIS=3
test_filter = test_firmware_boundaries, test_spec_compliance, test_serial_transport, test_can_transport

[env:esp32-s2]
extends = env:esp32-s3
board = esp32-s2-saola-1

[env:esp32-s2-axis1]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DNUM_AXIS=1

[env:esp32-s2-axis3]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DNUM_AXIS=3

[env:esp32-s2-serial]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DENABLE_MOTOR_OUTPUT=1 -DUSE_SERIAL_POSITION=1

[env:esp32-s2-timing]
extends = env:esp32-s2-serial
build_flags = ${env:esp32-s2-serial.build_flags} -DENABLE_TIMING_DIAGNOSTICS=1

[env:esp32-s3-timing]
extends = env:esp32-s3-serial
build_flags = ${env:esp32-s3-serial.build_flags} -DENABLE_TIMING_DIAGNOSTICS=1

[env:esp32-s2-force500]
extends = env:esp32-s2-serial
build_flags = ${env:esp32-s2-serial.build_flags} -DFORCE_TASK_PERIOD_MS=2

[env:esp32-s3-lcd]
extends = env:esp32-s3
build_flags =
	${env:esp32-s3.build_flags}
	-DENABLE_LCD=1
	-include firmware/include/tft_setup.h
lib_deps = bodmer/TFT_eSPI@^2.5.43

[env:esp32-s2-lcd]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DENABLE_LCD=1
lib_deps =
	${env:esp32-s3-lcd.lib_deps}

; Hardware-in-the-loop only: disconnect motors and connect a 3.3 V USB UART.
; ESP RX48 <- adapter TX; ESP TX45 -> adapter RX; common ground.
[env:esp32-s3-hil]
extends = env:esp32-s3-lcd
build_flags =
	${env:esp32-s3-lcd.build_flags}
	-DENABLE_MOTOR_OUTPUT=1
	-DUSE_SERIAL_POSITION=1
	-DENABLE_TIMING_DIAGNOSTICS=1
	-DRDX_PIN=48
	-DTDX_PIN=45
	-DENABLE_HIL_DIAGNOSTICS=1
lib_deps = ${env:esp32-s3-lcd.lib_deps}

; Minimal hardware validation: motor input/output and health frames, no LCD.
[env:esp32-s3-hil-minimal]
extends = env:esp32-s3
build_flags =
	${env:esp32-s3.build_flags}
	-DENABLE_MOTOR_OUTPUT=1
	-DUSE_SERIAL_POSITION=1
	-DENABLE_TIMING_DIAGNOSTICS=1
	-DRDX_PIN=48
	-DTDX_PIN=45
	-DENABLE_HIL_DIAGNOSTICS=1

; Compatibility environment retaining LCD load and the HID-only USB interface.
[env:esp32-s3-hil-lcd-only]
extends = env:esp32-s3-hil-minimal
build_flags =
	${env:esp32-s3-hil-minimal.build_flags}
	-DENABLE_LCD=1
	-include firmware/include/tft_setup.h
lib_deps = ${env:esp32-s3-lcd.lib_deps}

[env:esp32-s2-serial-fixed]
extends = env:esp32-s2-serial
build_flags = ${env:esp32-s2-serial.build_flags} -DSERIAL_FRAMING_MODE=1

[env:esp32-s3-serial-fixed]
extends = env:esp32-s3-serial
build_flags = ${env:esp32-s3-serial.build_flags} -DSERIAL_FRAMING_MODE=1

[env:esp32-s2-serial-mixed]
extends = env:esp32-s2-serial
build_flags = ${env:esp32-s2-serial.build_flags} -DSERIAL_FRAMING_MODE=2

[env:native-serial-benchmark]
extends = env:native
build_flags = ${env:native.build_flags} -O2 -DSERIAL_TRANSPORT_BENCHMARK=1
test_filter = test_serial_transport

[env:esp32-s2-can]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DMOTOR_TRANSPORT=1 -DENABLE_MOTOR_OUTPUT=1 -DUSE_CAN_POSITION=1

[env:esp32-s3-can]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -DMOTOR_TRANSPORT=1 -DENABLE_MOTOR_OUTPUT=1 -DUSE_CAN_POSITION=1

[env:esp32-s2-can-axis1]
extends = env:esp32-s2-can
build_flags = ${env:esp32-s2-can.build_flags} -DNUM_AXIS=1

[env:esp32-s3-can-axis3]
extends = env:esp32-s3-can
build_flags = ${env:esp32-s3-can.build_flags} -DNUM_AXIS=3

[env:esp32-s2-can-timing]
extends = env:esp32-s2-can
build_flags = ${env:esp32-s2-can.build_flags} -DENABLE_TIMING_DIAGNOSTICS=1

[env:esp32-s2-can-adc]
extends = env:esp32-s2
build_flags = ${env:esp32-s3.build_flags} -DMOTOR_TRANSPORT=1 -DENABLE_MOTOR_OUTPUT=1

[env:native-comm]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17
test_filter = test_communication_library

; Upgrade validation only: Arduino 3.3.12 / ESP-IDF 5.5.5, pinned platform release.
; Keep production environments on the existing platform until hardware validation passes.
[env:esp32-s3-upgrade]
extends = env:esp32-s3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_flags =
	${env:esp32-s3.build_flags}
	-DVALIDATE_USB_UPGRADE=1

[env:esp32-s3-upgrade-hil]
extends = env:esp32-s3-hil
platform = ${env:esp32-s3-upgrade.platform}
build_flags =
	${env:esp32-s3-hil.build_flags}
	-DVALIDATE_USB_UPGRADE=1
